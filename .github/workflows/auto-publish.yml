# ============================================================
# Publicação automática diária — RODA NO GITHUB ACTIONS.
#
# POR QUE: o plano Free (Hobby) da Vercel limita função serverless
# a 10s e cron a 1x/dia. O pipeline de auto-publish estoura os dois.
# Por isso ele roda aqui, no runner do GitHub (grátis, sem limite
# de duração). O endpoint /api/auto-publish da Vercel NÃO é usado.
#
# CONFIG (1x, manual):
# No GitHub: Settings > Secrets and variables > Actions, crie os
# secrets abaixo com os MESMOS valores do seu .env.local:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   SHOPEE_APP_ID, SHOPEE_APP_SECRET, GEMINI_API_KEY,
#   EVOLUTION_API_URL, EVOLUTION_INSTANCE_NAME, EVOLUTION_INSTANCE_TOKEN,
#   GROUP_WHATSAPP_ID, SITE_URL
#
# HORÁRIOS (UTC, BRT = UTC-3):
#   BRT 08 → UTC 11 = saudação bom dia
#   BRT 10,12,14,16,18,20,22 → UTC 13,15,17,19,21,23,01 = produtos
#   BRT 23 → UTC 02 = saudação boa noite
# ============================================================

name: auto-publish

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 BRT — bom dia
    - cron: "0 13 * * *"   # 10:00 BRT — produtos
    - cron: "0 15 * * *"   # 12:00 BRT — produtos
    - cron: "0 17 * * *"   # 14:00 BRT — produtos
    - cron: "0 19 * * *"   # 16:00 BRT — produtos
    - cron: "0 21 * * *"   # 18:00 BRT — produtos
    - cron: "0 23 * * *"   # 20:00 BRT — produtos
    - cron: "0 1 * * *"    # 22:00 BRT — produtos
    - cron: "0 2 * * *"    # 23:00 BRT — boa noite
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Descobrir tipo pelo horário UTC
        id: decide
        run: |
          H=$(date -u +%H)
          if [ "$H" = "11" ]; then TYPE=greeting; HOUR=8
          elif [ "$H" = "02" ]; then TYPE=greeting; HOUR=23
          else TYPE=products; HOUR=
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "Disparo UTC=$H -> type=$TYPE"

      - name: Rodar auto-publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_INSTANCE_NAME: ${{ secrets.EVOLUTION_INSTANCE_NAME }}
          EVOLUTION_INSTANCE_TOKEN: ${{ secrets.EVOLUTION_INSTANCE_TOKEN }}
          GROUP_WHATSAPP_ID: ${{ secrets.GROUP_WHATSAPP_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          AUTOPUBLISH_SEND_IMAGE: "true"
          AUTOPUBLISH_SEND_DELAY: "5"
          AUTOPUBLISH_MAX_OFFERS: "5"
        run: |
          if [ "${{ steps.decide.outputs.type }}" = "greeting" ]; then
            node scripts/run-auto-publish.js greeting "${{ steps.decide.outputs.hour }}"
          else
            node scripts/run-auto-publish.js products
          fi