<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel — Bendito Achadinho</title>
<meta name="robots" content="noindex, nofollow" />

<!-- Permite "Adicionar à Tela de Início" no iPhone: abre sem a barra do
     Safari (quase como um app) e usa o ícone/nome abaixo. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Painel" />
<meta name="theme-color" content="#e71942" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="icon" href="assets/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: #e71942;
    --red-deep: #b3102f;
    --pink: #fa88ab;
    --sticker-pink: #f8d2e1;
    --pale: #fff8fa;
    --ink: #24171b;
    --muted: #6b6068;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pale);
    color: var(--ink);
    font-family: "Poppins", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    color: var(--red);
    font-size: 20px;
    margin: 0;
  }
  a.site-link {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--red);
    text-decoration: none;
    border-bottom: 1px solid var(--sticker-pink);
  }
  a.site-link:hover { border-bottom-color: var(--red); }

  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 2px 8px rgba(21,21,21,0.05);
  }
  .stat .num {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--red);
    line-height: 1.1;
  }
  .stat .label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(21,21,21,0.06);
    margin-bottom: 20px;
  }
  .card h2 {
    font-family: "Baloo 2", sans-serif;
    font-size: 16px;
    color: var(--red);
    margin: 0 0 12px;
  }
  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }
  input[type="text"], input[type="password"], input[type="number"], input[type="search"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid var(--sticker-pink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    color: var(--ink);
    background: #fff;
  }
  input:focus-visible {
    border-color: var(--pink);
  }
  button {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: var(--red);
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.secondary {
    background: var(--sticker-pink);
    color: var(--red-deep);
  }
  button.ghost {
    background: none;
    color: var(--red);
    padding: 6px 10px;
    font-size: 12px;
  }
  :focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .row > div { flex: 1; }
  .status {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .status.error { color: var(--red); }
  .status.ok { color: #1a7a3d; }
  .status.info { color: var(--muted); }

  .search-wrap { margin-bottom: 12px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tabs button {
    flex: 1;
    background: var(--sticker-pink);
    color: var(--red-deep);
    font-size: 12.5px;
    padding: 9px 0;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--red);
    color: #fff;
  }

  .product {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f1e9ee;
  }
  .product:last-child { border-bottom: none; }
  .product img, .product .emoji {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--sticker-pink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .product .info { flex: 1; min-width: 0; }
  .product .title {
    font-weight: 600;
    font-size: 13.5px;
    line-height: 1.3;
  }
  .product .price {
    color: var(--red);
    font-weight: 700;
    font-size: 13.5px;
    margin-top: 2px;
  }
  .product .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: #555;
    background: #ececec;
    border-radius: 6px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .product .actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .product .actions button {
    font-size: 11.5px;
    padding: 6px 12px;
    flex-shrink: 0;
  }
  .product .main-btn {
    flex-shrink: 0;
  }
  .product .main-btn button {
    font-size: 12px;
    padding: 7px 14px;
  }

  .edit-fields {
    display: flex;
    gap: 8px;
    margin: 4px 0;
  }
  .edit-fields input { font-size: 13px; padding: 8px 10px; }

  #login-card { max-width: 340px; margin: 80px auto 0; }
  #app { display: none; }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

  <div class="wrap">
    <header class="top">
      <h1>✝️ Painel — Bendito Achadinho</h1>
      <a class="site-link" href="/" target="_blank" rel="noopener">Ver site ↗</a>
    </header>

    <div id="login-card" class="card">
      <h2>Entrar</h2>
      <label class="field-label" for="password-input">Senha do painel</label>
      <input type="password" id="password-input" autocomplete="current-password" />
      <div class="row" style="margin-top:12px"><button id="login-btn" style="width:100%">Entrar</button></div>
      <div id="login-status" class="status error" role="alert" aria-live="polite"></div>
    </div>

    <div id="app">
      <div class="stats" id="stats"></div>

      <div class="card">
        <h2>Cadastrar achadinho</h2>
        <label class="field-label" for="url-input">Link do produto na Shopee</label>
        <div class="row">
          <div>
            <input type="text" id="url-input" placeholder="Cole o link aqui..." />
          </div>
          <button id="curate-btn">Cadastrar</button>
        </div>
        <div id="curate-status" class="status" role="status" aria-live="polite"></div>
      </div>

      <div class="card">
        <h2>Publicados</h2>
        <div class="tabs" role="tablist" aria-label="Filtrar por status">
          <button type="button" class="status-tab" data-status="active" aria-pressed="true">Ativos</button>
          <button type="button" class="status-tab" data-status="inactive" aria-pressed="false">Removidos</button>
          <button type="button" class="status-tab" data-status="all" aria-pressed="false">Todos</button>
        </div>
        <div class="search-wrap">
          <label class="field-label" for="search-input">Buscar por nome</label>
          <input type="search" id="search-input" placeholder="Digite pra filtrar a lista..." />
        </div>
        <div id="product-list" aria-live="polite"></div>
      </div>
    </div>
  </div>

<script>
  let authHeader = sessionStorage.getItem("adminAuth") || "";
  let allProducts = [];
  let statusFilter = "active";

  function formatBRL(value) {
    return "R$ " + Number(value).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { ...(options.headers || {}), Authorization: authHeader },
    });
    if (res.status === 401) {
      sessionStorage.removeItem("adminAuth");
      showLogin("Senha incorreta ou sessão expirada.");
      throw new Error("unauthorized");
    }
    return res;
  }

  function showLogin(message) {
    document.getElementById("app").style.display = "none";
    document.getElementById("login-card").style.display = "block";
    document.getElementById("login-status").textContent = message || "";
  }

  function showApp() {
    document.getElementById("login-card").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadProducts();
  }

  async function tryLogin() {
    const password = document.getElementById("password-input").value;
    authHeader = "Basic " + btoa(":" + password);
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    try {
      const res = await fetch("/api/admin/products", { headers: { Authorization: authHeader } });
      if (res.status === 401) {
        document.getElementById("login-status").textContent = "Senha incorreta.";
        return;
      }
      sessionStorage.setItem("adminAuth", authHeader);
      showApp();
    } catch (err) {
      document.getElementById("login-status").textContent = "Erro de conexão: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function renderStats(products) {
    const active = products.filter((p) => p.active);
    const total = active.reduce((sum, p) => sum + p.price, 0);
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="num">${active.length}</div><div class="label">publicados</div></div>
      <div class="stat"><div class="num">${formatBRL(total)}</div><div class="label">valor total</div></div>
    `;
  }

  function renderProductRow(p) {
    const photo = p.image
      ? `<img src="${escapeHtml(p.image)}" alt="" />`
      : `<div class="emoji" aria-hidden="true">${p.emoji || "🛍️"}</div>`;
    const badge = p.active ? "" : `<span class="badge">removido</span>`;
    const toggleLabel = p.active ? "Remover" : "Restaurar";

    return `
      <div class="product" data-id="${p.id}">
        ${photo}
        <div class="info">
          <div class="view-mode">
            <div class="title">${escapeHtml(p.title)}${badge}</div>
            <div class="price">${formatBRL(p.price)}</div>
            <div class="actions">
              <button class="ghost copy-btn" data-link="${escapeHtml(p.affiliateLink)}">Copiar link</button>
              <a class="ghost" style="text-decoration:none;display:inline-block" href="${escapeHtml(p.affiliateLink)}" target="_blank" rel="noopener">Ver produto</a>
              <button class="ghost edit-btn">Editar</button>
              <button class="secondary toggle-btn" data-active="${p.active}">${toggleLabel}</button>
            </div>
          </div>
          <div class="edit-mode" style="display:none">
            <div class="edit-fields">
              <input type="text" class="edit-title" value="${escapeHtml(p.title)}" aria-label="Editar nome do produto" />
              <input type="number" step="0.01" min="0.01" class="edit-price" value="${p.price}" style="max-width:100px" aria-label="Editar preço" />
            </div>
            <div class="actions">
              <button class="save-btn">Salvar</button>
              <button class="ghost cancel-btn">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function applyFilterAndRender() {
    const query = document.getElementById("search-input").value.trim().toLowerCase();

    const byStatus = allProducts.filter((p) => {
      if (statusFilter === "active") return p.active;
      if (statusFilter === "inactive") return !p.active;
      return true;
    });
    const filtered = query
      ? byStatus.filter((p) => p.title.toLowerCase().includes(query))
      : byStatus;

    const list = document.getElementById("product-list");
    if (!filtered.length) {
      const emptyByStatus = {
        active: "Nenhum achadinho ativo.",
        inactive: "Nenhum achadinho removido.",
        all: "Nenhum achadinho cadastrado ainda.",
      };
      list.innerHTML = `<p class="empty-state">${query ? "Nenhum achadinho bate com essa busca." : emptyByStatus[statusFilter]}</p>`;
      return;
    }
    list.innerHTML = filtered.map(renderProductRow).join("");
    attachRowHandlers();
  }

  function attachRowHandlers() {
    document.querySelectorAll(".product").forEach((row) => {
      const id = row.dataset.id;

      row.querySelector(".copy-btn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        try {
          await navigator.clipboard.writeText(btn.dataset.link);
          const original = btn.textContent;
          btn.textContent = "Copiado!";
          setTimeout(() => (btn.textContent = original), 1500);
        } catch {
          alert("Não consegui copiar. Link: " + btn.dataset.link);
        }
      });

      row.querySelector(".edit-btn")?.addEventListener("click", () => {
        row.querySelector(".view-mode").style.display = "none";
        row.querySelector(".edit-mode").style.display = "block";
        row.querySelector(".edit-title").focus();
      });

      row.querySelector(".cancel-btn")?.addEventListener("click", () => {
        row.querySelector(".edit-mode").style.display = "none";
        row.querySelector(".view-mode").style.display = "block";
      });

      row.querySelector(".save-btn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        const title = row.querySelector(".edit-title").value.trim();
        const price = parseFloat(row.querySelector(".edit-price").value);
        if (!title || !(price > 0)) {
          alert("Preencha um nome e um preço válido.");
          return;
        }
        btn.disabled = true;
        try {
          await api(`/api/admin/products?id=${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, price }),
          });
          await loadProducts();
        } catch (err) {
          if (err.message !== "unauthorized") alert("Erro ao salvar: " + err.message);
        } finally {
          btn.disabled = false;
        }
      });

      row.querySelector(".toggle-btn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        const nextActive = btn.dataset.active !== "true";
        if (nextActive === false && !confirm("Remover esse achadinho do site?")) return;
        btn.disabled = true;
        try {
          await api(`/api/admin/products?id=${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ active: nextActive }),
          });
          await loadProducts();
        } catch (err) {
          btn.disabled = false;
        }
      });
    });
  }

  async function loadProducts() {
    const list = document.getElementById("product-list");
    list.innerHTML = `<p class="empty-state">Carregando...</p>`;
    try {
      const res = await api("/api/admin/products");
      allProducts = await res.json();
      renderStats(allProducts);
      applyFilterAndRender();
    } catch (err) {
      if (err.message !== "unauthorized") {
        list.innerHTML = `<p class="status error">Erro ao carregar: ${escapeHtml(err.message)}</p>`;
      }
    }
  }

  document.getElementById("login-btn").addEventListener("click", tryLogin);
  document.getElementById("password-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryLogin();
  });
  document.getElementById("search-input").addEventListener("input", applyFilterAndRender);

  document.querySelectorAll(".status-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      statusFilter = btn.dataset.status;
      document.querySelectorAll(".status-tab").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      applyFilterAndRender();
    });
  });

  document.getElementById("curate-btn").addEventListener("click", async () => {
    const input = document.getElementById("url-input");
    const status = document.getElementById("curate-status");
    const btn = document.getElementById("curate-btn");
    const url = input.value.trim();
    if (!url) return;

    btn.disabled = true;
    status.className = "status info";
    status.textContent = "Buscando na Shopee, revisando título e salvando... (pode levar alguns segundos)";

    try {
      const res = await api("/api/admin/curate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (!res.ok) {
        status.className = "status error";
        status.textContent = "❌ " + data.error;
        return;
      }
      if (data.duplicate) {
        status.className = "status info";
        status.textContent = `🔁 Esse já estava cadastrado: ${data.title} — ${formatBRL(data.price)}`;
      } else {
        status.className = "status ok";
        status.textContent = `✅ Cadastrado: ${data.title} — ${formatBRL(data.price)}`;
      }
      input.value = "";
      loadProducts();
    } catch (err) {
      if (err.message !== "unauthorized") {
        status.className = "status error";
        status.textContent = "❌ Erro: " + err.message;
      }
    } finally {
      btn.disabled = false;
    }
  });
  document.getElementById("url-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("curate-btn").click();
  });

  // Se já tem senha guardada nesta aba, tenta entrar direto.
  if (authHeader) {
    api("/api/admin/products")
      .then(() => showApp())
      .catch(() => {});
  }
</script>

</body>
</html>
